window.onerror = function(e,s,l,c) {
  console.error(e, s, l, c);
  var root = document.getElementById("root");
  var msg = '<div style="padding:40px;color:#DC2626;font-family:monospace;white-space:pre-wrap;font-size:14px;line-height:1.6"><h2 style="margin:0 0 12px">Runtime Error</h2>' + e + '<br>Line: ' + l + ', Col: ' + c + '</div>';
  if (root) root.innerHTML = msg; else document.body.innerHTML = msg;
  return true;
};
</script>

<script>
const {
  useState,
  useEffect,
  useMemo,
  useRef,
  useCallback,
  memo
} = React;

function getSizeRowsFromVariants(variantsStr) {
  try {
    let v = variantsStr;
    if (!v) return [];
    if (typeof v === "string") v = JSON.parse(v);
    if (!Array.isArray(v) || !v.length) return [];
    const choices = v[0].choices || [];
    return choices.map(c => ({ label: c.label || "", price: c.price != null ? String(c.price) : "" }));
  } catch (e) { return []; }
}
function sizeRowsToVariants(rows) {
  const choices = (rows || []).filter(r => String(r.label || "").trim()).map(r => ({
    label: String(r.label).trim(),
    price: Number(r.price) || 0
  }));
  if (!choices.length) return "";
  return JSON.stringify([{ name: "Size", choices: choices }]);
}
